apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: db-credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: db-credentials
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: redis-credentials
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
        property: value
    - secretKey: API_KEY
      remoteRef:
        key: api-keys
        property: key

