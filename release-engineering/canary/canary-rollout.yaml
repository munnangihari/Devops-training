apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hrms-canary
spec:
  replicas: 10

  selector:
    matchLabels:
      app: hrms-canary

  template:
    metadata:
      labels:
        app: hrms-canary
    spec:
      containers:
        - name: hrms
          image: nginx:1.25
          ports:
            - containerPort: 80

  strategy:
    canary:
      stableService: hrms-canary-stable
      canaryService: hrms-canary

      steps:
        - setWeight: 5
        - pause:
            duration: 30s

        - setWeight: 25
        - pause:
            duration: 30s

        - setWeight: 50
        - pause:
            duration: 30s

        - setWeight: 100
