apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-production
  labels:
    app: hrms
    version: v1.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hrms
      version: v1.0
  template:
    metadata:
      labels:
        app: hrms
        version: v1.0
    spec:
      containers:
        - name: hrms
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
