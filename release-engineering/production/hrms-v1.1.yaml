apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-production-v11
  labels:
    app: hrms
    version: v1.1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hrms
      version: v1.1
  template:
    metadata:
      labels:
        app: hrms
        version: v1.1
    spec:
      containers:
        - name: hrms
          image: nginx:1.26
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
