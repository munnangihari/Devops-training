apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackroth-app
  namespace: blackroth-capstone
  labels:
    app: blackroth-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackroth-app
  template:
    metadata:
      labels:
        app: blackroth-app
    spec:
      containers:
        - name: blackroth-app
          image: munnangihari/blackroth-capstone-app:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: blackroth-config
            - secretRef:
                name: blackroth-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
