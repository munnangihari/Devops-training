apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hrms-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/munnangihari/Devops-training.git
    targetRevision: main
    path: platform-baseline/blackroth-production-sre-platform/gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: hrms-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
