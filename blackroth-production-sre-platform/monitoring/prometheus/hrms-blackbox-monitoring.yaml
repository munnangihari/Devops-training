apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.27.0
          args:
            - --config.file=/etc/blackbox_exporter/config.yml
          ports:
            - name: http
              containerPort: 9115
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox_exporter
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: hrms-http-probe
  namespace: monitoring
  labels:
    release: prometheus
spec:
  interval: 30s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - http://hrms-service.default.svc.cluster.local/
      labels:
        service: hrms
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hrms-probe-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: hrms-blackbox-reliability
      rules:
        - alert: HRMSProbeFailure
          expr: probe_success{service="hrms"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "HRMS availability probe is failing"
            description: "Prometheus cannot successfully reach the HRMS HTTP endpoint."
        - alert: HRMSProbeLatencyHigh
          expr: probe_duration_seconds{service="hrms"} > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "HRMS probe response time exceeds 500ms"
            description: "Investigate application response time and dependencies."
