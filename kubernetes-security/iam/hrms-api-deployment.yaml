apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-api
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-api
  template:
    metadata:
      labels:
        app: hrms-api
    spec:
      serviceAccountName: hrms-api-sa
      containers:
      - name: hrms-api
        image: <your-api-image>
        ports:
        - containerPort: 8080
