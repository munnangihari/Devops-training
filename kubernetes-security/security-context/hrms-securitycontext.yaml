apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-secure-api
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-secure-api
  template:
    metadata:
      labels:
        app: hrms-secure-api
    spec:
      containers:
      - name: hrms-secure-api
        image: <your-api-image>
        securityContext:
          runAsUser: 1000
          runAsGroup: 3000
          allowPrivilegeEscalation: false
