apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hrms-api-role
  namespace: rbac-demo
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hrms-api-binding
  namespace: rbac-demo
subjects:
- kind: ServiceAccount
  name: hrms-api
  namespace: rbac-demo
roleRef:
  kind: Role
  name: hrms-api-role
  apiGroup: rbac.authorization.k8s.io
