# allow-ingress-to-api.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
  namespace: rbac-demo
spec:
  podSelector:
    matchLabels:
      app: hrms-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx   # adjust to your ingress controller's namespace
    ports:
    - protocol: TCP
      port: 80
