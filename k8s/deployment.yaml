apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-api
  namespace: hrms-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-api
  template:
    metadata:
      labels:
        app: hrms-api
    spec:
      containers:
        - name: hrms-api
          image: munnangihari/devops-week1-app:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-api
  namespace: hrms-api
spec:
  selector:
    app: hrms-api
  ports:
    - port: 80
      targetPort: 8000
