apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackroth-capstone-app
  namespace: development
  labels:
    app: blackroth-capstone-app
    environment: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackroth-capstone-app
  template:
    metadata:
      labels:
        app: blackroth-capstone-app
        environment: development
    spec:
      containers:
        - name: blackroth-capstone-app
          image: munnangihari/blackroth-capstone-app:latest
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: blackroth-capstone-app
  namespace: development
  labels:
    app: blackroth-capstone-app
spec:
  type: ClusterIP
  selector:
    app: blackroth-capstone-app
  ports:
    - port: 80
      targetPort: 8000
