apiVersion: v2
name: hrms
description: A Helm chart for deploying the HRMS application
type: application
version: 0.1.0
appVersion: "1.0.0"

# Optional metadata
home: https://example.com/hrms
icon: https://example.com/icon.png
maintainers:
  - name: Hari
    email: hari@example.com

# Dependencies for supporting components
dependencies:
  - name: redis
    version: 17.3.14
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: 12.5.6
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

